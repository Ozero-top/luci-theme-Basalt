<!DOCTYPE html>
<html lang="zh-CN" data-layout="top" data-darkmode="false" data-theme="light" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FD shell harness</title>
<link rel="icon" href="/luci-static/basalt/logo_48.png" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/luci-static/basalt/logo.svg" sizes="any">
<link rel="manifest" href="/luci-static/basalt/manifest.json">
<link rel="stylesheet" href="/luci-static/basalt/css/cascade.css">
<style>
	/* Fixed report overlay; pointer-events:none so it never steals the
	 * outside-click / rect measurements the checks perform. */
	#harness-report { position: fixed; top: 8px; right: 8px; width: 300px;
		max-height: 90vh; overflow: auto; font: 12px/1.5 monospace; z-index: 99999;
		background: #111; color: #9f9; padding: 10px; border-radius: 8px;
		pointer-events: none; }
	#harness-report .fail { color: #ff7676; }
	#harness-report h4 { color: #fff; margin: 0 0 6px; }
	/* canary for the hostile-unlayered-reset test: :where() is zero
	 * specificity, so the later injected universal `*` (also 0,0,0) wins on
	 * source order — proving the hostile reset really applies. */
	:where(.harness-probe) { position: absolute; top: -9999px;
		width: 4px; height: 4px; padding: 11px; margin: 11px; }
</style>
</head>
<body class="lang_zh-cn logged-in" data-page="admin-system-admin">

<!-- Mirror of header.ut/footer.ut chrome markup (v2 top bar). -->
<div class="fs-pattern" data-fs-chrome aria-hidden="true"></div>
<a class="fs-skip" data-fs-chrome href="#maincontent">跳到主要内容</a>

<div class="fs-shell">
	<nav class="fs-sidebar" data-fs-chrome aria-label="菜单">
		<div class="fs-brandrow">
			<a class="fs-brand" href="/cgi-bin/luci/">
				<span class="fs-logo">
					<svg aria-hidden="true" viewBox="-9 -1 100 100"><path d="m40.5 50.8a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2m-40.5-33.9 7 6.8a47.5 47.5 0 0 1 67.2 0l7-6.8a57.2 57.2 0 0 0-81.2 0" fill="#00b5e2"/><path d="m12.5 29.2 6.8 7a30 30 0 0 1 42.6 0l6.8-7a39.7 39.7 0 0 0-56.3 0" fill="#00b5e2"/><path d="m24.8 41.6 6.8 6.9a12.6 12.6 0 0 1 18 0l6.8-6.9a22.3 22.3 0 0 0-31.6 0" fill="#00b5e2"/><path class="fs-logo-ring" d="m64.9 39.7a30.2 30.2 0 1 1-48.7 0l-6.9-7a39.9 39.9 0 1 0 62.5 0z"/></svg>
				</span>
				<span class="fs-wordmark">iStoreOS</span>
			</a>
		</div>

		<div id="indicators" class="fs-indicators"></div>

		<ul class="nav" id="topmenu"></ul>
		<ul id="modemenu" class="fs-modemenu"></ul>

		<a class="fs-logout" href="/cgi-bin/luci/admin/logout" title="退出" aria-label="退出">
			<svg class="fs-ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M14 12h7m0 0-3-3m3 3-3 3"/></svg>
			<span class="fs-label">退出</span>
		</a>
	</nav>

	<main class="fs-main" id="maincontent" tabindex="-1">
		<div class="fs-title fs-sr" data-fs-chrome>
			<h1 class="fs-title-main">iStoreOS</h1>
		</div>

		<div class="fs-content" data-page="admin-system-admin">
			<div id="tabmenu" style="display:none"></div>

			<!-- stock LuCI CBI markup, for visual comparison -->
			<div class="cbi-map">
				<h2 name="content">管理权</h2>
				<fieldset class="cbi-section"><div class="cbi-section-node">
					<div class="cbi-value">
						<label class="cbi-value-title">主机名</label>
						<div class="cbi-value-field"><input class="cbi-input-text" type="text" value="iStoreOS"></div>
					</div>
					<div class="cbi-value cbi-value-last">
						<label class="cbi-value-title">模式</label>
						<div class="cbi-value-field">
							<select class="cbi-input-select"><option>网关</option><option>AP</option></select>
						</div>
					</div>
				</div></fieldset>
				<div class="cbi-page-actions">
					<button type="button" class="btn cbi-button cbi-button-apply">保存并应用</button>
					<button type="button" class="btn cbi-button">重置</button>
				</div>
			</div>
		</div>

		<footer class="fs-footer" role="contentinfo">
			<span>Powered by LuCI / OpenWrt 24.10</span>
		</footer>
	</main>
</div>

<div id="harness-report"><h4>shell</h4><div class="harness-probe" aria-hidden="true"></div><div id="harness-log"></div></div>

<script>window.TR = {};</script>
<script src="/luci-static/resources/cbi.js"></script>
<script src="/luci-static/resources/luci.js?v=h4"></script>
<script>
'use strict';
sessionStorage.setItem('luci-session-store', JSON.stringify({
	'0000000000000000000000000000000': { features: {}, preload: [], rpcBaseURL: '/ubus/' }
}));
window.L = new LuCI({
	scriptname: '/cgi-bin/luci',
	resource: '/luci-static/resources',
	media: '/luci-static/basalt',
	ubuspath: '/ubus',
	sessionid: '00000000000000000000000000000000',
	nodespec: { satisfied: true, readonly: false }
});

(async function() {
	const log = document.getElementById('harness-log');
	const results = [];
	function check(name, cond, extra) {
		results.push({ name, ok: !!cond, extra });
		const d = document.createElement('div');
		d.className = cond ? 'pass' : 'fail';
		d.textContent = (cond ? 'PASS ' : 'FAIL ') + name + (extra !== undefined ? '  [' + extra + ']' : '');
		log.appendChild(d);
	}
	const wait = (ms) => new Promise(r => setTimeout(r, ms));
	const waitFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

	const request = await L.require('request');
	request.post = function() {
		return Promise.resolve({ ok: true, status: 200,
			json() { return { jsonrpc: '2.0', id: 1, result: [0, {}] }; } });
	};

	const ui = await L.require('ui');

	/* ---- mock menu tree (Chinese zh-CN firmware shape) ---- */
	function node(name, title, children) {
		return { name, title, children: children || {}, sortOrder: 0, satisfied: true };
	}
	// Many System children, as iStoreOS/OpenWrt zh builds ship.
	const sysChildren = {};
	['快速设置向导','管理权','启动项','计划任务','挂载点','分区扩容',
	 '磁盘管理','系统控制','进阶设置','内核参数','备份与更新','文件','释放内存',
	 '重启','关机'].forEach(function(t, i) {
		sysChildren['c' + i] = node('c' + i, t);
	});
	// The dispatch leaf 管理权 carries section tabs.
	sysChildren.admin = node('admin', '管理权', {
		password: node('password', '密码设置'),
		sshkeys: node('sshkeys', 'SSH-Keys')
	});
	const admin = node('admin', 'Administration', {
		home: node('home', '首页'),
		status: node('status', '状态', {
			overview: node('overview', '概览')
		}),
		system: node('system', '系统', sysChildren),
		services: node('services', '服务', {
			s1: node('s1', '服务一'), s2: node('s2', '服务二')
		}),
		network: node('network', '网络', {
			n1: node('n1', '接口')
		}),
		wireguard: node('wireguard', 'VPN 隧道', {
			wg1: node('wg1', 'WireGuard 实例')
		}),
		customapp: node('customapp', '第三方插件'),
		logout: node('logout', '退出')
	});
	/* Alias-mode firmware shape: an extra public landing mode ("概览")
	 * aliases into admin/status/overview. ui.menu.getChildren() swaps its
	 * children for the target node's; the section pills must still render
	 * from the dispatched admin node. ?alias=1 enables this variant. */
	const aliasMode = new URLSearchParams(location.search).has('alias');
	const rootChildren = { admin };
	if (aliasMode) {
		rootChildren.home = {
			name: 'home', title: '概览', satisfied: true,
			action: { type: 'alias', path: 'admin/status/overview' },
			children: {}
		};
	}
	const tree = node('root', 'root', rootChildren);
	ui.menu.load = function() { return Promise.resolve(tree); };

	if (aliasMode) {
		// requested /home, dispatched to admin/status/overview
		L.env.dispatchpath = ['admin', 'status', 'overview'];
		L.env.requestpath = ['home'];
	} else {
		// Dispatch path = admin / system / admin(管理权) / password(tab)
		L.env.dispatchpath = ['admin', 'system', 'admin', 'password'];
		L.env.requestpath = ['admin'];
	}

	/* boot the real theme menu module */
	await L.require('menu-basalt');
	for (let i = 0; i < 50 && !document.querySelector('#topmenu > li'); i++)
		await wait(50);
	await wait(100);

	const isDesktop = window.innerWidth >= 900;
	const rootEl = document.documentElement;
	const topPill = (name) => document.querySelector('#topmenu > li[data-name="' + name + '"] > a');
	const panelOf = (name) => document.querySelector('#topmenu > li[data-name="' + name + '"] > ul');

	/* ============ light tokens / pattern ============ */
	const css = getComputedStyle(rootEl);
	check('html is fixed top layout', rootEl.getAttribute('data-layout') === 'top');
	check('html forced light', rootEl.getAttribute('data-darkmode') === 'false' &&
		rootEl.getAttribute('data-bs-theme') === 'light');
	check('--fs-bg is Fluent light #f3f2f1',
		css.getPropertyValue('--fs-bg').trim() === '#f3f2f1',
		css.getPropertyValue('--fs-bg').trim());
	/* The opaque canvas colour lives on <html>; body/.fs-main/footer must stay
	 * transparent so the z-index:-1 pattern layer is not covered. */
	const rootBg = getComputedStyle(document.documentElement).backgroundColor;
	check('html canvas painted #f3f2f1', rootBg === 'rgb(243, 242, 241)', rootBg);
	const transparentEls = [document.body, document.querySelector('.fs-main'),
		document.querySelector('footer.fs-footer')];
	check('body/.fs-main/footer transparent for the pattern',
		transparentEls.every(el => {
			const bg = getComputedStyle(el).backgroundColor;
			return bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent';
		}), transparentEls.map(el => getComputedStyle(el).backgroundColor).join(' | '));

	const pattern = document.querySelector('.fs-pattern');
	const mask = pattern && (getComputedStyle(pattern).maskImage ||
		getComputedStyle(pattern).webkitMaskImage || '');
	check('pattern layer masked with texture.svg', !!pattern && mask.includes('texture.svg'),
		mask.slice(0, 90));

	/* brand wordmark stays one line (no mid-word wrap of a name like OpenWrt) */
	const wordmark = document.querySelector('.fs-wordmark');
	const wmStyle = getComputedStyle(wordmark);
	check('wordmark kept on a single line', wmStyle.whiteSpace === 'nowrap' &&
		wmStyle.webkitLineClamp === 'none', wmStyle.whiteSpace + '/' + wmStyle.webkitLineClamp);

	/* page cards are opaque panel white in Fluent light; dropdown panels
	 * and modal chrome share the guarantee for legibility */
	const cardBg = getComputedStyle(document.querySelector('.cbi-section')).backgroundColor;
	check('content cards are opaque panel white', cardBg === 'rgb(255, 255, 255)', cardBg);

	check('skip link present', !!document.querySelector('a.fs-skip[href="#maincontent"]'));
	check('sr-only h1 clipped', /inset/.test(getComputedStyle(document.querySelector('.fs-title')).clipPath));
	check('footer present', /Powered by/.test(document.querySelector('.fs-footer').textContent));
	check('old settings entry removed from the menu',
		document.getElementById('topmenu').textContent.indexOf('Basalt 主题设置') === -1);

	/* ============ mode menu / tabs ============ */
	const modemenu = document.getElementById('modemenu');
	if (aliasMode) {
		check('modemenu renders both modes', modemenu.querySelectorAll('li').length === 2);
		check('multi modemenu visible', !modemenu.classList.contains('single') &&
			getComputedStyle(modemenu).display !== 'none', getComputedStyle(modemenu).display);
		check('requested landing mode highlighted',
			(document.querySelector('#modemenu li.active a') || {}).textContent === '概览');
		check('tabs absent on the overview leaf',
			document.querySelectorAll('#tabmenu ul.tabs > li').length === 0 &&
			document.getElementById('tabmenu').style.display === 'none');
	} else {
		check('modemenu renders the one mode', modemenu.querySelectorAll('li').length === 1);
		check('single modemenu hidden', modemenu.classList.contains('single') &&
			getComputedStyle(modemenu).display === 'none', getComputedStyle(modemenu).display);

		const tabItems = document.querySelectorAll('#tabmenu ul.tabs > li');
		check('section tabs rendered', tabItems.length === 2, tabItems.length);
		check('active tab follows dispatchpath',
			!!document.querySelector('#tabmenu .tabmenu-item-password.active') &&
			!tabItems[1].classList.contains('active'));
		check('#tabmenu shown', document.getElementById('tabmenu').style.display !== 'none');
	}

	/* ============ Fluent page head (menu-basalt.js injector) ============ */
	/* the injector runs in a rAF; give it a beat before asserting */
	for (let i = 0; i < 50 && !document.querySelector('.fs-content > .fs-pghead'); i++)
		await wait(20);
	const pghead = document.querySelector('.fs-content > .fs-pghead');
	check('.fs-pghead injected', !!pghead);
	check('head mounts before #tabmenu',
		!!pghead && pghead.nextElementSibling === document.getElementById('tabmenu'));
	check('page title rendered in the head',
		document.querySelector('.fs-pg-title')?.textContent.trim() === 'iStoreOS');
	const wantCrumbs = aliasMode ? '状态|概览' : '管理权|密码设置';
	check('crumbs keep the last two named nodes',
		Array.from(document.querySelectorAll('.fs-crumbs span')).map(s => s.textContent).join('|')
			=== wantCrumbs);
	const migratedBar = document.querySelector('.fs-pg-actions .cbi-page-actions');
	check('actions bar migrated into the head', !!migratedBar &&
		document.querySelectorAll('.fs-content .cbi-page-actions').length === 1);
	check('migrated bar drops its own rhythm', !!migratedBar &&
		getComputedStyle(migratedBar).marginTop === '0px' &&
		getComputedStyle(migratedBar).marginBottom === '0px' &&
		getComputedStyle(migratedBar).paddingTop === '0px');

	/* the uci banner's × removes its alert (document-level delegate) */
	const fakeAlert = document.createElement('div');
	fakeAlert.className = 'alert-message info fs-uci-alert';
	fakeAlert.innerHTML = '<button type="button" class="fs-alert-close"></button>';
	document.querySelector('.fs-content').appendChild(fakeAlert);
	fakeAlert.querySelector('.fs-alert-close').click();
	check('uci banner dismiss removes the alert', !fakeAlert.isConnected);

	/* ============ pill markup / icons ============ */
	const pills = Array.from(document.querySelectorAll('#topmenu > li'));
	check('pills rendered for all sections but logout', pills.length === 7, pills.length);
	check('tree logout skipped in topmenu',
		!Array.from(document.querySelectorAll('#topmenu a')).some(a => /\/logout$/.test(a.href)));
	check('bar logout control present',
		/\/admin\/logout$/.test(document.querySelector('a.fs-logout').href));

	['home', 'status', 'system', 'services', 'network', 'wireguard', 'customapp'].forEach(function(n) {
		check('pill li[data-name="' + n + '"] exists',
			!!document.querySelector('#topmenu > li[data-name="' + n + '"]'));
	});

	/* icons keyed by stable node name, independent of Chinese titles */
	const iconBody = (name) => {
		const svg = topPill(name).querySelector('svg.fs-ico');
		return svg ? svg.innerHTML : null;
	};
	check('status icon body', /<rect /.test(iconBody('status')));
	check('system icon body', iconBody('system').indexOf('M9 2v3') !== -1);
	check('network icon body', iconBody('network').indexOf('cx="6" cy="18"') !== -1);
	check('wireguard node falls back to vpn icon', iconBody('wireguard').indexOf('<rect x="4" y="10"') === 0);
	check('unknown node falls back to default circle',
		/^<circle cx="12" cy="12" r="8\.5"(\/>|><\/circle>)$/.test(iconBody('customapp')));

	/* bar pills are text-only: the CSS hides icon and chevron */
	check('pill icons hidden in bar',
		getComputedStyle(topPill('status').querySelector('.fs-ico')).display === 'none');
	const sysTrigger = topPill('system');
	check('system chevron exists but hidden in bar',
		!!sysTrigger.querySelector('.fs-chevron') &&
		getComputedStyle(sysTrigger.querySelector('.fs-chevron')).display === 'none');

	/* active section: ink on the disclosure <a>, plate on the <li> only */
	if (aliasMode) {
		check('dispatched status section is active',
			!!document.querySelector('#topmenu > li[data-name="status"].active'));
		check('active leaf inside dropdown', (function() {
			const a = document.querySelector('#topmenu > li[data-name="status"] li a.active');
			return !!a && /\/status\/overview$/.test(a.href) && a.textContent.trim() === '概览';
		})());
	} else {
		check('system section is active',
			document.querySelector('#topmenu > li[data-name="system"].active') &&
			!sysTrigger.classList.contains('active'));
		check('active leaf inside dropdown', (function() {
			const a = document.querySelector('#topmenu > li[data-name="system"] li a.active');
			return !!a && /\/system\/admin$/.test(a.href) && a.textContent.trim() === '管理权';
		})());
	}

	/* leaf pill is a plain link, not a disclosure button */
	const homeA = topPill('home');
	check('leaf pill is a plain link',
		!homeA.hasAttribute('role') && !homeA.hasAttribute('aria-expanded') &&
		/\/admin\/home$/.test(homeA.href));

	/* ============ dropdown disclosure ============ */
	const sysPanel = panelOf('system');
	check('system is a disclosure',
		sysTrigger.getAttribute('role') === 'button' &&
		sysTrigger.getAttribute('aria-expanded') === 'false' &&
		sysTrigger.getAttribute('aria-controls') === sysPanel.id);
	check('panel hidden initially', getComputedStyle(sysPanel).display === 'none');

	sysTrigger.click();
	await waitFrame(); await wait(60);
	check('tap opens the panel',
		sysTrigger.closest('li').classList.contains('open') &&
		sysTrigger.getAttribute('aria-expanded') === 'true' &&
		getComputedStyle(sysPanel).display === 'block');
	check('dropdown panel stays opaque',
		!/rgba\([^)]*,\s*0?\.\d/.test(getComputedStyle(sysPanel).backgroundColor),
		getComputedStyle(sysPanel).backgroundColor);
	const subLinks = sysPanel.querySelectorAll('li a');
	check('panel lists the system entries', subLinks.length >= 15, subLinks.length);
	check('panel links carry no icons',
		!Array.from(subLinks).some(a => a.querySelector('svg.fs-ico')));
	const sample = subLinks[0].getBoundingClientRect();
	const panelR = sysPanel.getBoundingClientRect();
	check('panel link text inside panel',
		sample.left >= panelR.left - 1 && sample.right <= panelR.right + 1);

	/* exclusivity: opening another section closes the first */
	const srvTrigger = topPill('services');
	srvTrigger.click();
	await waitFrame(); await wait(60);
	check('opening another panel closes the first',
		!sysTrigger.closest('li').classList.contains('open') &&
		srvTrigger.closest('li').classList.contains('open'));

	/* Escape closes and restores focus */
	sysTrigger.click();
	await waitFrame(); await wait(60);
	document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
	check('Escape closes panel and focuses trigger',
		!sysTrigger.closest('li').classList.contains('open') &&
		document.activeElement === sysTrigger);

	/* outside click closes */
	sysTrigger.click();
	await waitFrame(); await wait(60);
	document.querySelector('.fs-content').click();
	check('outside click closes panel',
		!sysTrigger.closest('li').classList.contains('open'));

	/* edge clamp: every open panel must stay inside the viewport */
	const hasSubNames = ['system', 'services', 'network', 'wireguard'];
	hasSubNames.forEach(function(n) {
		if (!isDesktop && n !== 'system') return;
		const t = topPill(n), p = panelOf(n);
		t.click();
	});
	await waitFrame(); await wait(100);
	const openPanels = Array.from(document.querySelectorAll('#topmenu > li.has-sub.open > ul'));
	openPanels.forEach(function(p) {
		const r = p.getBoundingClientRect();
		check('clamped panel (' + r.width + 'px) inside viewport',
			r.right <= window.innerWidth - 8 + 1 && r.left >= 8 - 1,
			'right=' + Math.round(r.right) + ' vw=' + window.innerWidth);
	});
	/* tidy up */
	document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
	document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
	await wait(60);

	/* ============ bar geometry ============ */
	const bar = document.querySelector('.fs-sidebar');
	const nav = document.getElementById('topmenu');
	const brand = document.querySelector('.fs-brand');
	const logout = document.querySelector('.fs-logout');
	const barR = bar.getBoundingClientRect();
	const navR = nav.getBoundingClientRect();
	const brandR = brand.getBoundingClientRect();
	const logoutR = logout.getBoundingClientRect();

	check('bar is a sticky top flex row',
		getComputedStyle(bar).position === 'sticky' &&
		getComputedStyle(bar).flexDirection === 'row');

	if (isDesktop) {
		check('brand and menu share one row',
			Math.abs(navR.top - brandR.top) < 12,
			'nav ' + Math.round(navR.top) + ' brand ' + Math.round(brandR.top));
		check('menu spans the bar free space',
			navR.right > window.innerWidth - 120, Math.round(navR.right));
		check('logout sits at the far edge',
			logoutR.right > window.innerWidth - 40, Math.round(logoutR.right));
		if (aliasMode) {
			/* two modes: the mode strip takes its own row below the bar */
			const modeR = modemenu.getBoundingClientRect();
			check('mode strip wraps to a second row',
				modeR.top >= navR.bottom - 1 && barR.height > 55,
				'mode ' + Math.round(modeR.top) + ' nav-b ' + Math.round(navR.bottom) +
				' bar ' + Math.round(barR.height));
		} else {
			check('bar stays a single row',
				barR.height <= 70, Math.round(barR.height));
		}
	} else {
		check('menu wraps below the brand row',
			navR.top >= brandR.bottom - 1,
			'nav ' + Math.round(navR.top) + ' brand-b ' + Math.round(brandR.bottom));
		check('menu strip spans the bar width',
			navR.right >= window.innerWidth - 24 && navR.left <= 24,
			Math.round(navR.left) + '-' + Math.round(navR.right));
		check('menu strip scrolls horizontally',
			nav.scrollWidth > nav.clientWidth + 2,
			nav.scrollWidth + '>' + nav.clientWidth);
		check('strip overflow-x auto with hidden scrollbar',
			getComputedStyle(nav).overflowX === 'auto' &&
			getComputedStyle(nav).scrollbarWidth === 'none');
		check('logout stays on the brand row',
			logoutR.top < navR.top && logoutR.bottom <= brandR.bottom + 24,
			'logout ' + Math.round(logoutR.top) + '-' + Math.round(logoutR.bottom));
	}

	/* ============ third-party unlayered universal reset guard ============
	 * OpenClash's oc-common.css ships an UNLAYERED `* { margin:0; padding:0 }`.
	 * Unlayered declarations beat every @layer declaration regardless of
	 * specificity, which is what collapsed the whole shell against the left
	 * edge. styles/theme/00-reset-guard.css is emitted unlayered on purpose;
	 * after a hostile sheet is injected the geometry must stay identical. */
	const hostileProbe = document.querySelector('.harness-probe');
	check('reset probe spaced before injection',
		getComputedStyle(hostileProbe).paddingTop === '11px' &&
		getComputedStyle(hostileProbe).marginTop === '11px');

	const guardTargets = [
		['.fs-sidebar', 'top bar'],
		['.fs-content', 'content column'],
		['footer.fs-footer', 'footer'],
		['.cbi-map > h2', 'heading card'],
		['fieldset.cbi-section', 'section card'],
		['fieldset.cbi-section .cbi-value', 'value row'],
		['.cbi-value-title', 'value title'],
		['.cbi-page-actions', 'page actions'],
		['.fs-pghead', 'page head'],
		['.fs-pg-actions', 'page head actions'],
		['.cbi-page-actions .cbi-button', 'action button'],
		['#topmenu > li > a', 'nav pill']
	];
	function boxGeom(sel) {
		const el = document.querySelector(sel);
		if (!el) return null;
		const cs = getComputedStyle(el);
		const r = el.getBoundingClientRect();
		return {
			mt: cs.marginTop, mr: cs.marginRight, mb: cs.marginBottom, ml: cs.marginLeft,
			pt: cs.paddingTop, pr: cs.paddingRight, pb: cs.paddingBottom, pl: cs.paddingLeft,
			x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height)
		};
	}
	const cleanGeom = {};
	guardTargets.forEach(function(t) { cleanGeom[t[0]] = boxGeom(t[0]); });

	const hostile = document.createElement('style');
	hostile.id = 'harness-hostile-reset';
	/* exact oc-common.css L1924 shape: plain declarations, no !important */
	hostile.textContent = '* { margin: 0; padding: 0; }';
	document.head.appendChild(hostile);
	await waitFrame();

	check('hostile unlayered reset is in effect',
		getComputedStyle(hostileProbe).paddingTop === '0px' &&
		getComputedStyle(hostileProbe).marginTop === '0px',
		getComputedStyle(hostileProbe).paddingTop + '/' + getComputedStyle(hostileProbe).marginTop);
	guardTargets.forEach(function(t) {
		const g = boxGeom(t[0]);
		check('reset guard keeps ' + t[1] + ' geometry',
			JSON.stringify(g) === JSON.stringify(cleanGeom[t[0]]),
			g ? 'pt=' + g.pt + ' pl=' + g.pl + ' x=' + g.x + ' w=' + g.w : 'element missing');
	});
	const contentCS = getComputedStyle(document.querySelector('.fs-content'));
	check('content padding survives the reset',
		parseFloat(contentCS.paddingTop) > 0 && parseFloat(contentCS.paddingLeft) > 0,
		contentCS.paddingTop + '/' + contentCS.paddingLeft);
	check('top bar padding survives the reset',
		parseFloat(getComputedStyle(document.querySelector('.fs-sidebar')).paddingLeft) > 0);
	const footerCS = getComputedStyle(document.querySelector('footer.fs-footer'));
	check('footer padding survives the reset',
		parseFloat(footerCS.paddingTop) > 0 && parseFloat(footerCS.paddingLeft) > 0,
		footerCS.paddingTop + '/' + footerCS.paddingLeft);
	if (isDesktop) {
		const contentEl = document.querySelector('.fs-content');
		const cr = contentEl.getBoundingClientRect();
		const ccs = getComputedStyle(contentEl);
		check('content column stays centred under the reset',
			ccs.marginLeft === ccs.marginRight &&
			Math.abs(cr.left - (window.innerWidth - cr.width) / 2) < 1,
			'ml=' + ccs.marginLeft + ' mr=' + ccs.marginRight +
			' x=' + Math.round(cr.left) + ' w=' + Math.round(cr.width));
	} else {
		const pillCS = getComputedStyle(document.querySelector('#topmenu > li > a'));
		check('nav pill padding survives the reset (narrow)',
			parseFloat(pillCS.paddingLeft) > 0, pillCS.paddingLeft);
	}

	const failed = results.filter(r => !r.ok).length;
	const h = document.createElement('h4');
	h.textContent = failed === 0 ? 'ALL %d CHECKS PASSED'.format(results.length)
		: '%d/%d FAILED'.format(failed, results.length);
	h.style.color = failed ? '#ff7676' : '#7ee787';
	log.prepend(h);
	window.__harness = { results, failed };
})().catch(function(e) {
	const d = document.createElement('div');
	d.className = 'fail';
	d.textContent = 'HARNESS ERROR: ' + (e && e.stack ? e.stack : e);
	document.getElementById('harness-log').appendChild(d);
});
</script>
</body>
</html>
