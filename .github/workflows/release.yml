name: Release packages

# Pushing a version tag (v1.1.1, v2.0.0-rc1, ...) builds both packages with
# the official OpenWrt SDKs and publishes them on the matching GitHub
# Release. Tags containing a hyphen are treated as prereleases. Re-running
# the workflow on an existing tag updates that release's assets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: SDK packages
    uses: ./.github/workflows/build-packages.yml

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload .ipk / .apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/**/luci-theme-Basalt_*_all.ipk
            dist/**/luci-theme-Basalt-*.apk
