<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
	<!-- Basalt original texture: rounded tiles, rings and a small
	     network graph. Every glyph stays inside a 26px inset margin, so the
	     tile repeats seamlessly on all four edges. Alpha-only art — the
	     theme masks with it and paints the glyphs in the theme ink. -->
