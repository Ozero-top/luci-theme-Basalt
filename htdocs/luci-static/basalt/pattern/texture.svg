		<circle cx="168" cy="62" r="24"/>
		<path d="M184 96a26 26 0 0 1 14 23" stroke-width="1.6"/>
		<circle cx="176" cy="172" r="17"/>
		<path d="M168 201h16M176 193v16" stroke-width="1.6"/>
		<path d="M62 160l34 18 20-32"/>
		<circle cx="62" cy="160" r="5" fill="#fff" stroke="none"/>
		<circle cx="96" cy="178" r="5" fill="#fff" stroke="none"/>
		<circle cx="116" cy="146" r="5" fill="#fff" stroke="none"/>
		<path d="M44 128l18-14" stroke-width="1.6"/>
	</g>
	<g fill="#fff">
		<circle cx="202" cy="44" r="2.6"/>
		<circle cx="128" cy="34" r="2.2"/>
		<circle cx="40" cy="112" r="2.4"/>
